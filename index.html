<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETLOG - 개인 아카이브</title>
    <style>
        /* 싸이월드 Y2K 감성 배경 */
        body { background-color: #a3a3a3; background-image: radial-gradient(#cfcfcf 1px, transparent 1px); background-size: 3px 3px; font-family: "돋움", dotum, sans-serif; font-size: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .outer-box { background-color: #b5d5d5; border: 1px solid #76abab; border-radius: 15px; padding: 20px 8px 8px 25px; width: 900px; height: 560px; position: relative; display: flex; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); }
        .inner-box { background-color: #f0f0f0; border: 2px dashed white; border-radius: 10px; width: 100%; height: 100%; display: flex; padding: 10px; }
        .left-section { width: 200px; height: 100%; background: white; border: 1px solid #ddd; border-radius: 10px; display: flex; flex-direction: column; align-items: center; padding: 15px 0; margin-right: 8px; }
        .today-count { font-size: 10px; margin-bottom: 10px; }
        .red { color: #ff0000; font-weight: bold; }
        .profile-img-box { width: 170px; height: 160px; border: 1px solid #eee; margin-bottom: 15px; overflow: hidden; }
        .profile-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .profile-msg { width: 170px; font-size: 11px; color: #666; line-height: 1.6; padding: 10px 0; border-top: 1px dashed #eee; text-align: center; }
        .profile-name { font-weight: bold; color: #3b87ab; font-size: 13px; margin-top: 5px; }
        .right-section { flex: 1; height: 100%; background: white; border: 1px solid #ddd; border-radius: 10px; display: flex; flex-direction: column; padding: 20px; position: relative; }
        .main-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 15px; }
        .main-title { font-size: 16px; font-weight: bold; color: #3b87ab; }
        .bgm-bar { background-color: #eee; border: 1px solid #ccc; padding: 5px 10px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .content-area { flex: 1; overflow-y: auto; }
        .data-flow-box { border: 1px dashed #3b87ab; background-color: #f0f7fa; padding: 10px; margin-top: 10px; }
        .flow-title { font-weight: bold; color: #3b87ab; margin-bottom: 5px; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .photo-card { background: white; border: 1px solid #ddd; padding: 5px; text-align: center; }
        .photo-card img { width: 100%; height: 130px; object-fit: cover; border: 1px solid #eee; }
        .tabs { position: absolute; right: -58px; top: 60px; display: flex; flex-direction: column; gap: 3px; }
        .tab { width: 55px; height: 35px; background-color: #3b87ab; color: white; border: 1px solid #28607a; border-left: none; border-radius: 0 5px 5px 0; display: flex; justify-content: center; align-items: center; text-decoration: none; font-size: 11px; cursor: pointer; }
        .tab.active { background-color: white; color: #3b87ab; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        button { background: #3b87ab; color: white; border: 1px solid #28607a; padding: 3px 8px; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="outer-box">
        <div class="inner-box">
            <div class="left-section">
                <div class="today-count">TODAY <span class="red">1</span> | TOTAL 486</div>
                <div class="profile-img-box"><img src="photo.jpg" alt="Profile"></div>
                <div class="profile-msg">혼자여도 외롭지 않게.. <br>나의 여행 기록, PETLOG.</div>
                <div class="profile-name">강지완(^_^)v</div>
            </div>
            <div class="right-section">
                <div class="main-header">
                    <div class="main-title" id="page-title">나의 여행 펫로그(PETLOG)...★</div>
                </div>
                <div class="bgm-bar">
                    <div>♬ 볼빨간사춘기 - 여름아 부탁해</div>
                    <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
                    <div><button onclick="document.getElementById('bgm').play()">▶</button> <button onclick="document.getElementById('bgm').pause()">⏸</button></div>
                </div>
                <div class="content-area">
                    <!-- 홈 탭 -->
                    <div id="home-tab" class="tab-content active">
                        <div style="text-align:center; padding:20px; background:#f9f9f9; border-radius:10px;">
                            "그때 그 시절의 나를 다시 만나는 형식"
                        </div>
                        <div class="data-flow-box">
                            <div class="flow-title">기억의 흐름</div>
                            <div style="font-size: 11px;"><b>광주 출생</b> 2004.01.01</div>
                        </div>
                    </div>
                    <!-- 사진첩 탭 -->
                    <div id="album-tab" class="tab-content">
                        <div class="photo-grid" id="photo-gallery">
                            <p style="text-align:center; color:#999; grid-column: span 2;">사진을 불러오는 중...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="tabs">
            <div class="tab active" id="tab-home" onclick="switchTab('home')">홈</div>
            <div class="tab" id="tab-album" onclick="switchTab('album')">사진첩</div>
        </div>
    </div>

    <!-- Firebase 연결 및 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV8ZmL3W19IBFNivnNFpJpNX_dX-ayg",
            authDomain: "petlog-camera.firebaseapp.com",
            projectId: "petlog-camera",
            storageBucket: "petlog-camera.firebasestorage.app",
            messagingSenderId: "354143104664",
            appId: "1:354143104664:web:b2f24fb605d68e8ee7aaed",
            measurementId: "G-RY4J9VPC76"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 탭 전환 기능
        window.switchTab = (type) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(type === 'home') {
                document.getElementById('home-tab').classList.add('active');
                document.getElementById('tab-home').classList.add('active');
                document.getElementById('page-title').innerText = "나의 여행 펫로그(PETLOG)...★";
            } else {
                document.getElementById('album-tab').classList.add('active');
                document.getElementById('tab-album').classList.add('active');
                document.getElementById('page-title').innerText = "추억 사진첩...📷";
            }
        };

        // Firebase 데이터 읽기
        const photosRef = ref(db, 'photos');
        onValue(photosRef, (snapshot) => {
            const data = snapshot.val();
            const gallery = document.getElementById('photo-gallery');
            if (data) {
                gallery.innerHTML = "";
                Object.values(data).reverse().forEach(photo => {
                    gallery.innerHTML += `
                        <div class="photo-card">
                            <img src="${photo.url}">
                            <div style="font-size:10px; color:#666; margin-top:5px;">${photo.time}</div>
                        </div>`;
                });
            } else {
                gallery.innerHTML = '<p style="text-align:center; color:#999; grid-column: span 2;">아직 기록된 사진이 없습니다.</p>';
            }
        });
    </script>
</body>
</html>

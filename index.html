<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PETLOG 미니홈피</title>
    <style>
        /* 싸이월드 도트 배경 */
        body {
            background-color: #a3a3a3;
            background-image: radial-gradient(#cfcfcf 1px, transparent 1px);
            background-size: 3px 3px;
            font-family: "돋움", dotum, sans-serif;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 외부 회색 테두리 */
        .outer-box {
            background-color: #b5d5d5;
            border: 1px solid #76abab;
            border-radius: 10px;
            padding: 20px 10px 10px 25px;
            width: 900px;
            height: 550px;
            position: relative;
            display: flex;
        }

        /* 내부 흰색 점선 테두리 */
        .inner-box {
            background-color: white;
            border: 2px dashed #76abab;
            border-radius: 10px;
            width: 100%;
            height: 100%;
            display: flex;
            padding: 15px;
        }

        /* 왼쪽 프로필 섹션 */
        .left-section {
            width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid #eee;
            padding-right: 15px;
        }

        .today-count {
            font-size: 10px;
            margin-bottom: 10px;
        }
        .today-count span:first-child { color: red; font-weight: bold; }

        .profile-image-box {
            width: 170px;
            height: 150px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .profile-image-box img { width: 100%; height: 100%; object-fit: cover; }

        .profile-text {
            font-size: 11px;
            color: #666;
            line-height: 1.5;
            text-align: left;
            width: 170px;
            height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .profile-name {
            font-weight: bold;
            color: #3b87ab;
            margin-bottom: 5px;
        }

        /* 오른쪽 메인 섹션 */
        .right-section {
            flex: 1;
            padding-left: 15px;
            display: flex;
            flex-direction: column;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #eee;
        }

        .main-title {
            font-size: 16px;
            font-weight: bold;
            color: #3b87ab;
        }

        .bgm-player {
            background-color: #eee;
            border: 1px solid #ccc;
            padding: 2px 10px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .content-box {
            background-color: #f6f6f6;
            flex: 1;
            border-radius: 5px;
            padding: 15px;
            overflow-y: auto;
        }

        /* 미니룸 감성 */
        .miniroom {
            width: 100%;
            height: 200px;
            background: white;
            border: 1px solid #ddd;
            margin-bottom: 15px;
            position: relative;
            background-image: url('https://raw.githubusercontent.com/jinwook857-eng/petlog/main/miniroom_bg.png'); /* 배경있으면 좋음 */
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 탭 버튼 (오른쪽 바깥) */
        .tabs {
            position: absolute;
            right: -55px;
            top: 50px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tab {
            width: 55px;
            height: 35px;
            background-color: #3b87ab;
            color: white;
            border: 1px solid #296d8f;
            border-radius: 0 5px 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }

        /* 버튼 감성 */
        .btn-green {
            background-color: #299971;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .photo-card {
            background: white;
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
        }

        .photo-card img { width: 100%; height: 120px; object-fit: cover; }

    </style>
</head>
<body>

    <div class="outer-box">
        <div class="inner-box">
            <!-- 왼쪽: 프로필 -->
            <div class="left-section">
                <div class="today-count">
                    TODAY <span>48</span> | TOTAL <span>1520</span>
                </div>
                <div class="profile-image-box">
                    <!-- 여기에 당신의 펫로그 카메라 사진을 넣으세요 -->
                    <img src="https://aioni.jnu.ac.kr/api/download-file?filename=p_CHAT_01KZZ32Y58R5RBCB699318P879.jpg" alt="PETLOG">
                </div>
                <div class="profile-text">
                    혼자여도 외롭지 않게, 당신의 모든 여행을 기억합니다. <br><br>
                    <b>[PETLOG 프로젝트]</b><br>
                    강지완 팀<br>
                    #Y2K #펫로그 #감성기록
                </div>
                <div class="profile-name">강지완(^_^)v</div>
                <select style="width: 170px; font-size: 11px;">
                    <option>파도타기</option>
                    <option>조원1 미니홈피</option>
                    <option>조원2 미니홈피</option>
                </select>
            </div>

            <!-- 오른쪽: 메인 -->
            <div class="right-section">
                <div class="title-bar">
                    <div class="main-title">나의 여행 펫로그(PETLOG)...★</div>
                    <div class="bgm-player">
                        <span>♬ Freestyle - Y (Feat. 서후)</span>
                        <audio id="bgm" loop>
                            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
                        </audio>
                        <button onclick="document.getElementById('bgm').play()" style="font-size: 9px;">▶</button>
                    </div>
                </div>

                <div class="content-box">
                    <!-- 미니룸 영역 -->
                    <div class="miniroom">
                        <img src="https://aioni.jnu.ac.kr/api/download-file?filename=p_CHAT_01KZZ32Y58R5RBCB699318P879.jpg" style="height: 150px; border: 5px solid white; transform: rotate(-5deg); box-shadow: 2px 2px 5px rgba(0,0,0,0.2);">
                        <div style="position: absolute; bottom: 10px; right: 10px; font-weight: bold; color: #3b87ab;">PETLOG 미니룸</div>
                    </div>

                    <!-- 최근 게시물 -->
                    <div style="margin-top: 10px;">
                        <div style="color: #3b87ab; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Updated Memories [2]</div>
                        <div class="photo-grid">
                            <div class="photo-card">
                                <img src="https://aioni.jnu.ac.kr/api/download-file?filename=p_CHAT_01KZZ32Y58R5RBCB699318P879.jpg">
                                <div>첫 번째 기록</div>
                            </div>
                            <div class="photo-card">
                                <div style="height: 120px; background: #eee; display: flex; justify-content: center; align-items: center; color: #999;">연결 대기 중</div>
                                <div>두 번째 기록</div>
                            </div>
                        </div>
                    </div>

                    <!-- 음성 메모 -->
                    <div style="margin-top: 20px; padding: 10px; background: #fff; border: 1px solid #ddd;">
                        <b style="color: #299971;">🎙️ 오늘의 감정 녹음</b>
                        <div style="margin-top: 5px;">
                            <button class="btn-green" onclick="alert('녹음 기능을 활성화합니다.')">녹음 시작</button>
                            <span style="font-size: 11px; color: #999; margin-left: 10px;">카메라 장치와 연동 중...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 오른쪽 탭 메뉴 -->
        <div class="tabs">
            <a href="#" class="tab">홈</a>
            <a href="#" class="tab" style="background-color: white; color: #3b87ab;">사진첩</a>
            <a href="#" class="tab">방명록</a>
        </div>
    </div>

</body>
</html>

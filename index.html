<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PETLOG - 개인 아카이브</title>
    <style>
        body { background-color: #a3a3a3; background-image: radial-gradient(#cfcfcf 1px, transparent 1px); background-size: 3px 3px; font-family: "돋움", dotum, sans-serif; font-size: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .outer-box { background-color: #b5d5d5; border: 1px solid #76abab; border-radius: 15px; padding: 20px 8px 8px 25px; width: 900px; height: 560px; position: relative; display: flex; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); }
        .inner-box { background-color: #f0f0f0; border: 2px dashed white; border-radius: 10px; width: 100%; height: 100%; display: flex; padding: 10px; }
        .left-section { width: 200px; height: 100%; background: white; border: 1px solid #ddd; border-radius: 10px; display: flex; flex-direction: column; align-items: center; padding: 15px 0; margin-right: 8px; }
        .profile-img-box { width: 170px; height: 160px; border: 1px solid #eee; margin-bottom: 15px; overflow: hidden; background: #eee; }
        .profile-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .right-section { flex: 1; height: 100%; background: white; border: 1px solid #ddd; border-radius: 10px; display: flex; flex-direction: column; padding: 20px; position: relative; }
        .main-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 15px; }
        .main-title { font-size: 16px; font-weight: bold; color: #3b87ab; }
        .bgm-bar { background-color: #eee; border: 1px solid #ccc; padding: 5px 10px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .content-area { flex: 1; overflow-y: auto; }
        .intro-quote { text-align:center; padding:15px; background:#f9f9f9; border-radius:10px; font-style: italic; margin-bottom: 15px; color: #555; }
        .last-memory-section { margin-top: 20px; }
        .memory-title { color: #3b87ab; font-weight: bold; margin-bottom: 10px; font-size: 12px; border-left: 3px solid #3b87ab; padding-left: 8px; }
        .memory-container { display: flex; gap: 15px; justify-content: space-around; }
        .memory-box { width: 45%; height: 150px; border: 2px dashed #ccc; background-color: #fafafa; position: relative; overflow: hidden; border-radius: 5px; display: flex; align-items: center; justify-content: center; }
        .memory-box img { width: 100%; height: 100%; object-fit: cover; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .photo-card { background: white; border: 1px solid #ddd; padding: 5px; text-align: center; }
        .photo-card img { width: 100%; height: 130px; object-fit: cover; }
        .tabs { position: absolute; right: -58px; top: 60px; display: flex; flex-direction: column; gap: 3px; }
        .tab { width: 55px; height: 35px; background-color: #3b87ab; color: white; border: 1px solid #28607a; border-left: none; border-radius: 0 5px 5px 0; display: flex; justify-content: center; align-items: center; font-size: 11px; cursor: pointer; }
        .tab.active { background-color: white; color: #3b87ab; font-weight: bold; }
        .tab.deco { background-color: #e67e22; border-color: #d35400; margin-top: 5px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        button { background: #3b87ab; color: white; border: 1px solid #28607a; padding: 3px 8px; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="outer-box">
        <div class="inner-box">
            <div class="left-section">
                <div style="font-size:10px; margin-bottom:10px;">TODAY <span style="color:red; font-weight:bold;">1</span> | TOTAL 486</div>
                <div class="profile-img-box">
                    <!-- 깃허브에 올린 photo.jpg 사용 -->
                    <img src="./photo.jpg" alt="Profile" onerror="this.src='https://via.placeholder.com/170x160'">
                </div>
                <div style="width:170px; font-size:11px; color:#666; text-align:center; padding-top:10px; border-top:1px dashed #eee;">혼자여도 외롭지 않게.. <br>나의 여행 기록, PETLOG.</div>
                <div style="font-weight:bold; color:#3b87ab; font-size:13px; margin-top:5px;">강지완(^_^)v</div>
            </div>

            <div class="right-section">
                <div class="main-header"><div class="main-title" id="page-title">나의 여행 펫로그(PETLOG)...★</div></div>
                <div class="bgm-bar">
                    <div>♬ 볼빨간사춘기 - 여름아 부탁해</div>
                    <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
                    <div><button onclick="document.getElementById('bgm').play()">▶</button> <button onclick="document.getElementById('bgm').pause()">⏸</button></div>
                </div>
                <div class="content-area">
                    <div id="home-tab" class="tab-content active">
                        <div class="intro-quote">"그때 그 시절의 나를 다시 만나는 형식"</div>
                        <div class="last-memory-section">
                            <div class="memory-title">당신의 마지막 기억</div>
                            <div class="memory-container">
                                <div class="memory-box">
                                    <!-- 깃허브에 올린 꽃 사진 -->
                                    <img src="./memoryFiles1.jpg">
                                </div>
                                <div class="memory-box">
                                    <!-- 깃허브에 올린 스쿠버 사진 -->
                                    <img src="./memoryFiles2.jpg">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="album-tab" class="tab-content">
                        <div class="photo-grid" id="photo-gallery"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="tabs">
            <div class="tab active" id="tab-home" onclick="switchTab('home')">홈</div>
            <div class="tab" id="tab-album" onclick="switchTab('album')">사진첩</div>
            <div class="tab deco" onclick="alert('꾸미기 기능 준비 중!')">꾸미기</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 사진첩 탭은 여전히 실시간성을 위해 수파베이스 사용
        const SUPABASE_URL = 'https://oufwpsalnoegeumlsum.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91Zm93cHNhbG5vZWdld21sc3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDMyMzEsImV4cCI6MjEwMjUxOTIzMX0.imgcjToUmrNMzv3Zf9G-srYhtyi5Sm811pSmANo2wkU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadAlbum() {
            const gallery = document.getElementById('photo-gallery');
            const buckets = ['photos', 'PHOTO2', 'PHOTO3'];
            let html = "";
            for (const b of buckets) {
                const { data } = await supabaseClient.storage.from(b).list();
                if (data) {
                    data.forEach(f => {
                        if (f.name !== '.emptyFolderPlaceholder') {
                            const url = `${SUPABASE_URL}/storage/v1/object/public/${b}/${f.name}`;
                            html += `<div class="photo-card"><img src="${url}"><div>${f.name}</div></div>`;
                        }
                    });
                }
            }
            gallery.innerHTML = html || '<p style="text-align:center; color:#999; grid-column:span 2;">기록이 없습니다.</p>';
        }

        window.switchTab = (type) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(type === 'home') {
                document.getElementById('home-tab').classList.add('active');
                document.getElementById('tab-home').classList.add('active');
                document.getElementById('page-title').innerText = "나의 여행 펫로그(PETLOG)...★";
            } else {
                document.getElementById('album-tab').classList.add('active');
                document.getElementById('tab-album').classList.add('active');
                document.getElementById('page-title').innerText = "추억 사진첩...📷";
                loadAlbum();
            }
        };
    </script>
</body>
</html>
